<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.workers.dev http://127.0.0.1:* http://localhost:*; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef0f3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="color-scheme" content="light dark">
<title>文章 · shikibe's blog</title>
<meta name="description" content="文章正文。">
<script src="assets/js/theme-init.js"></script>
<link rel="stylesheet" href="assets/css/skeleton.css">
<link rel="stylesheet" href="assets/css/blog.css">
</head>
<body data-route="">
<a class="skip-link" href="#main">跳到主内容</a>
<noscript>
  <div class="noscript-bar">
    <strong>shikibe's blog</strong>本站导航由脚本渲染，当前脚本不可用。可直接访问：
    <a href="index.html">首页</a>

  </div>
</noscript>
<div class="shell">
  <div data-shell="header"></div>
  <main id="main" class="sheet" data-post-page>

    <!-- ① 读取中。结构照着真实排版的节奏摆，内容到位时不会整页跳动。 -->
    <div class="post-state" data-post-loading>
      <div class="post-state__line post-state__line--title"></div>
      <div class="post-state__line post-state__line--lead"></div>
      <div class="post-state__line post-state__line--body"></div>
      <div class="post-state__line post-state__line--short"></div>
      <p class="sr-only" role="status">正在读取文章</p>
    </div>

    <!-- ② 读到了 -->
    <div data-post-ready hidden>
      <header class="article__head" data-slot="post-head">
        <div class="article__meta" data-post-meta></div>
        <h1 class="article__title" data-post-title></h1>
        <p class="article__standfirst" data-post-standfirst></p>
      </header>

      <div class="split">
        <p class="section-mark">§ 01 · 正文</p>
        <div class="prose" data-post-body></div>

        <aside class="margin-col" data-post-aside>
          <div class="margin-note" data-slot="author-note">
            <p class="margin-note__title">作者</p>
            <p><strong data-post-author></strong></p>
            <p>折腾 AI，以及一些奇奇怪怪的想法。</p>
          </div>

          <div class="margin-note" data-slot="related-note">
            <p class="margin-note__title">其它记录</p>
            <div class="facts" data-post-related>
              <div class="facts__row"><a class="facts__k" href="timeline.html">全部归档</a></div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <!-- ③ 没读到。静态兜底必须自解释，不能让访客面对一片空白。
         用 --tall 变体：整页级的空状态居中放在一块玻璃里，
         比「左上角一行小字 + 一片黑」更像一个刻意的状态。 -->
    <div class="blank blank--tall" data-post-empty hidden>
      <p class="blank__title" data-empty-title>没有这篇文章</p>
      <p class="blank__desc" data-empty-desc></p>
    </div>

  </main>
  <div data-shell="colophon"></div>
</div>
<script src="assets/js/shell.js"></script>
<script src="assets/js/blog-api.js"></script>
</body>
</html>
