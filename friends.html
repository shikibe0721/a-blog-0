<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f7f4ec">
<title>友链 · xingyub's blog</title>

<script>
  // 样式表之前就定好主题，避免深色用户闪一次浅色
  try {
    var t = localStorage.getItem("skeleton-theme");
    if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="assets/css/skeleton.css">
</head>
<body data-route="/friends">
<noscript>
  <div class="noscript-bar">
    <strong>xingyub's blog</strong>本站导航由脚本渲染，当前脚本不可用。可直接访问：
    <a href="index.html">首页</a>

</noscript>
<div class="shell">
  <div data-shell="header"></div>
  <main class="sheet">
    <section class="folio" data-slot="folio">
      <span class="folio__num">§ 08 · 友链</span>
      <h1 class="folio__title">互相路过的邻居</h1>
      <p class="folio__desc">常读的博客与常去的地方。</p>
      <hr class="folio__rule">
    </section>

    <div class="card-grid" data-slot="friend-grid">
      <a class="index-card" href="#">
        <span class="index-card__no">№ 01</span>
        <h2 class="index-card__title">{{站点名}}</h2>
        <p class="index-card__desc">{{一句话简介}}</p>
        <div class="index-card__foot"><span class="tag">{{域名}}</span></div>
      </a>
      <a class="index-card" href="#">
        <span class="index-card__no">№ 02</span>
        <h2 class="index-card__title">{{站点名}}</h2>
        <p class="index-card__desc">{{一句话简介}}</p>
        <div class="index-card__foot"><span class="tag">{{域名}}</span></div>
      </a>
      <a class="index-card" href="#">
        <span class="index-card__no">№ 03</span>
        <h2 class="index-card__title">{{站点名}}</h2>
        <p class="index-card__desc">{{一句话简介}}</p>
        <div class="index-card__foot"><span class="tag">{{域名}}</span></div>
      </a>
    </div>

    <p class="section-mark mt-12">§ 08.1 · 申请</p>
    <div class="facts maxw-md" data-slot="friend-apply">
      <div class="facts__row"><span class="facts__k">站点名称</span><span class="facts__v">{{占位}}</span></div>
      <div class="facts__row"><span class="facts__k">站点地址</span><span class="facts__v">{{占位}}</span></div>
      <div class="facts__row"><span class="facts__k">头像链接</span><span class="facts__v">{{占位}}</span></div>
      <div class="facts__row"><span class="facts__k">一句话简介</span><span class="facts__v">{{占位}}</span></div>
    </div>
    <p class="mt-5"><button class="btn btn--solid" type="button">提交申请 <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button></p>
  </main>
  <div data-shell="colophon"></div>
</div>
<script src="assets/js/shell.js"></script>
