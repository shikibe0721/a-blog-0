<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f7f4ec">
<title>光影画廊 · xingyub's blog</title>
<meta name="description" content="定格时间，封存泰拉与现实的每一次心跳。">
<script>
  // 样式表之前就定好主题，避免深色用户闪一次浅色
  try {
    var t = localStorage.getItem("skeleton-theme");
    if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="assets/css/skeleton.css">
</head>
<body data-route="/photowall">
<noscript>
  <div class="noscript-bar">
    <strong>xingyub's blog</strong>本站导航由脚本渲染，当前脚本不可用。可直接访问：
    <a href="index.html">首页</a>
    <a href="timeline.html">归档</a>
    <a href="chatter.html">杂谈</a>
    <a href="photowall.html">照片墙</a>
    <a href="projects.html">项目</a>
    <a href="moments.html">说说</a>
    <a href="music.html">音乐</a>
    <a href="tree.html">灵境</a>
    <a href="friends.html">友链</a>
    <a href="about.html">关于</a>
  </div>
</noscript>
<div class="shell">
  <div data-shell="header"></div>
  <main class="sheet sheet--wide">
    <section class="folio" data-slot="folio">
      <span class="folio__num">§ 03 · 照片墙</span>
      <h1 class="folio__title">光影画廊</h1>
      <p class="folio__desc">定格时间，封存泰拉与现实的每一次心跳。</p>
      <hr class="folio__rule">
    </section>

    <label class="field field--icon maxw-sm" data-slot="album-search" class="mb-8">
      <span class="field__icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></span>
      <input type="search" placeholder="搜索相册" aria-label="搜索相册">
    </label>

    <div class="card-grid" data-slot="album-grid">
      <a class="plate" href="#">
        <div class="plate__frame">
          <img src="assets/img/placeholder.svg" alt="{{相册封面描述}}">
          <span class="plate__count">2 张</span>
        </div>
        <div class="plate__caption">
          <h2 class="plate__title">泰拉大陆纪行</h2>
          <span class="plate__date">2026.01</span>
        </div>
        <p class="plate__desc">关于源石、孤星与前文明的视觉记录（测试用相册）</p>
      </a>
      <a class="plate" href="#">
        <div class="plate__frame">
          <img src="assets/img/placeholder.svg" alt="{{相册封面描述}}">
          <span class="plate__count">3 张</span>
        </div>
        <div class="plate__caption">
          <h2 class="plate__title">唐宋历史巡游</h2>
          <span class="plate__date">2025.10</span>
        </div>
        <p class="plate__desc">寻访千年前的长安与汴梁遗迹（测试用相册）</p>
      </a>
      <a class="plate" href="#">
        <div class="plate__frame">
          <img src="assets/img/placeholder.svg" alt="{{相册封面描述}}">
          <span class="plate__count">{{N}} 张</span>
        </div>
        <div class="plate__caption">
          <h2 class="plate__title">{{相册名称}}</h2>
          <span class="plate__date">{{YYYY.MM}}</span>
        </div>
        <p class="plate__desc">{{相册一句话描述}}</p>
      </a>
    </div>

    <div class="blank mt-10" data-slot="lightbox-blank">
      <p class="blank__title">灯箱位</p>
      <p class="blank__desc">点击相册后在此展开大图查看器。骨架里只留位置。</p>
    </div>
  </main>
  <div data-shell="colophon"></div>
</div>
<script src="assets/js/shell.js"></script>
</body>
</html>
