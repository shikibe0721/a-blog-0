<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音乐馆 · xingyub's blog</title>
<meta name="description" content="{{页面描述}}">
<link rel="stylesheet" href="assets/css/skeleton.css">
</head>
<body data-route="/music">

<div class="bg-layer" aria-hidden="true">
  <div class="bg-layer__orb bg-layer__orb--a"></div>
  <div class="bg-layer__orb bg-layer__orb--b"></div>
  <div class="bg-layer__orb bg-layer__orb--c"></div>
  <div class="bg-layer__veil"></div>
</div>
<div class="bg-layer__wave" aria-hidden="true"></div>

<div class="shell">
  <div data-shell="header"></div>

  <main class="page">

    <div class="page-head" data-slot="page-head">
      <h1 class="page-title">音乐馆</h1>
      <p class="page-sub">{{一句话副标题：写作时在循环什么}}</p>
    </div>

    <section class="grid-12">

      <!-- 播放器主卡 -->
      <div class="col-8">
        <article class="card" data-slot="now-playing">
          <div class="card__body card--pad-lg">
            <span class="card-label">Now Playing</span>
            <div class="row" style="gap:24px;align-items:flex-start;">
              <div class="player__art" style="margin:0;width:120px;height:120px;border-radius:var(--r-md);font-size:36px;">♪</div>
              <div class="fill">
                <h2 style="margin:0 0 6px;font-family:var(--font-ui);font-size:22px;font-weight:800;">{{曲名}}</h2>
                <p style="margin:0;color:var(--fg-muted);font-size:14px;">{{艺术家}} · {{专辑}}</p>
                <div class="player__bar" style="margin-top:20px;"><span></span></div>
                <div class="spread mt-sm" style="font-family:var(--font-mono);font-size:12px;color:var(--fg-faint);">
                  <span>{{00:00}}</span><span>{{00:00}}</span>
                </div>
              </div>
            </div>
          </div>
        </article>
      </div>

      <!-- 播放列表 -->
      <div class="col-4">
        <article class="card" data-slot="playlist">
          <div class="card__body">
            <span class="card-label">Playlist</span>
            <div class="rec-list">
              <a class="rec" href="#"><span class="rec__title">{{曲名占位}}</span><span class="rec__date">{{时长}}</span></a>
              <a class="rec" href="#"><span class="rec__title">{{曲名占位}}</span><span class="rec__date">{{时长}}</span></a>
              <a class="rec" href="#"><span class="rec__title">{{曲名占位}}</span><span class="rec__date">{{时长}}</span></a>
              <a class="rec" href="#"><span class="rec__title">{{曲名占位}}</span><span class="rec__date">{{时长}}</span></a>
            </div>
          </div>
        </article>
      </div>

    </section>

    <div class="empty card mt-lg" data-slot="music-empty">
      <div class="empty__icon">♪</div>
      <span class="empty__title">No Music Available</span>
      <span class="empty__hint">请检查播放列表或网络连接</span>
    </div>

  </main>

  <div data-shell="footer"></div>
</div>

<script src="assets/js/shell.js"></script>
</body>
</html>
