<!DOCTYPE html>

<head>
<meta charset="utf-8">

<script>
  // 样式表之前就定好主题，避免深色用户闪一次浅色
  try {
    var t = localStorage.getItem("skeleton-theme");
    if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="assets/css/skeleton.css">
</head>
<body data-route="/projects">
<noscript>
  <div class="noscript-bar">

<div class="shell">
  <div data-shell="header"></div>
  <main class="sheet">
    <section class="folio" data-slot="folio">
      <span class="folio__num">§ 04 · 项目</span>
      <h1 class="folio__title">在写的东西</h1>
      <p class="folio__desc">做过的、在做的、以及开了个头就搁着的。都记在这里，免得忘掉。</p>
      <hr class="folio__rule">
    </section>

    <div class="toolbar" data-slot="toolbar">
      <label class="field field--icon toolbar__search">
        <span class="field__icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></span>
        <input type="search" placeholder="搜索项目" aria-label="搜索项目">
      </label>
      <div class="chips" data-slot="chips"><button class="chip is-active" type="button" data-chip>全部</button><button class="chip" type="button" data-chip>进行中</button><button class="chip" type="button" data-chip>已归档</button><button class="chip" type="button" data-chip>实验性</button></div>
    </div>

    <p class="section-mark">§ 04.1 · 全部项目</p>

    <div class="card-grid mt-4" data-slot="project-grid">
      <article class="index-card">
        <span class="index-card__no">№ 01 · 进行中</span>
        <h2 class="index-card__title">{{项目名称}}</h2>
        <p class="index-card__desc">{{一句话说明它解决什么问题，以及为什么值得做。}}</p>
        <div class="index-card__foot"><span class="tag">Python</span><span class="tag">PyTorch</span></div>
      </article>
      <article class="index-card">
        <span class="index-card__no">№ 02 · 进行中</span>
        <h2 class="index-card__title">{{项目名称}}</h2>
        <p class="index-card__desc">{{一句话说明。}}</p>
        <div class="index-card__foot"><span class="tag">Spring Boot</span></div>
      </article>
      <article class="index-card">
        <span class="index-card__no">№ 03 · 已归档</span>
        <h2 class="index-card__title">{{项目名称}}</h2>
        <p class="index-card__desc">{{一句话说明。}}</p>
        <div class="index-card__foot"><span class="tag">Vue</span><span class="tag">D3</span></div>
      </article>
      <article class="index-card">
        <span class="index-card__no">№ 04 · 实验性</span>
        <h2 class="index-card__title">{{项目名称}}</h2>
        <p class="index-card__desc">{{一句话说明。}}</p>
        <div class="index-card__foot"><span class="tag">Rust</span></div>
      </article>
    </div>
  </main>
  <div data-shell="colophon"></div>
</div>
<script src="assets/js/shell.js"></script>
</body>
</html>
