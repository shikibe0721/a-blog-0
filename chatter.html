<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云端杂谈 · xingyub's blog</title>
<meta name="description" content="{{页面描述}}">
<link rel="stylesheet" href="assets/css/skeleton.css">
</head>
<body data-route="/chatter">

<div class="bg-layer" aria-hidden="true">
  <div class="bg-layer__orb bg-layer__orb--a"></div>
  <div class="bg-layer__orb bg-layer__orb--b"></div>
  <div class="bg-layer__orb bg-layer__orb--c"></div>
  <div class="bg-layer__veil"></div>
</div>
<div class="bg-layer__wave" aria-hidden="true"></div>

<div class="shell">
  <div data-shell="header"></div>

  <main class="page page--wide">

    <div class="page-head page-head--center" data-slot="page-head">
      <h1 class="page-title">云端杂谈</h1>
      <p class="page-sub page-sub--quote">“ {{一句短引语}} ”</p>
    </div>

    <div class="search" data-slot="chatter-search">
      <span class="search__icon">⌕</span>
      <input class="search__input" type="search" placeholder="搜索杂谈…">
    </div>

    <!-- 标签筛选 -->
    <div class="filters" data-slot="chatter-filters">
      <button class="filter is-active" type="button" data-filter>全部</button>
      <button class="filter" type="button" data-filter># {{标签一}}</button>
      <button class="filter" type="button" data-filter># {{标签二}}</button>
      <button class="filter" type="button" data-filter># {{标签三}}</button>
    </div>

    <!-- 瀑布流卡片：每张 = 封面图 + 心情徽章 + 日期 + 标题 + 摘要 + 标签 -->
    <section class="masonry mt-lg" data-slot="chatter-masonry">

      <div class="break-inside-avoid">
        <a class="card" href="chatter-detail.html" style="display:block;">
          <div style="position:relative;height:208px;overflow:hidden;">
            <div class="media-card__img" style="position:absolute;"><img src="" alt=""></div>
            <div class="media-card__scrim"></div>
            <span class="badge" style="position:absolute;top:16px;right:16px;">✨ {{心情}}</span>
          </div>
          <div class="card__body">
            <div style="font-family:var(--font-ui);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-bottom:12px;">
              {{YYYY-MM-DD HH:mm:ss}}
            </div>
            <h3 style="margin:0 0 12px;font-family:var(--font-ui);font-size:20px;font-weight:800;line-height:1.3;">{{杂谈标题}}</h3>
            <p style="margin:0;font-size:14.5px;color:var(--fg-muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">{{杂谈摘要，三行以内。}}</p>
            <div class="tag-row mt-md">
              <span class="tag">#{{标签一}}</span>
              <span class="tag">#{{标签二}}</span>
              <span class="tag">#{{标签三}}</span>
            </div>
          </div>
        </a>
      </div>

      <div class="break-inside-avoid">
        <a class="card" href="chatter-detail.html" style="display:block;">
          <div style="position:relative;height:160px;overflow:hidden;">
            <div class="media-card__img" style="position:absolute;"><img src="" alt=""></div>
            <div class="media-card__scrim"></div>
            <span class="badge" style="position:absolute;top:16px;right:16px;">✨ {{心情}}</span>
          </div>
          <div class="card__body">
            <div style="font-family:var(--font-ui);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-bottom:12px;">
              {{YYYY-MM-DD HH:mm:ss}}
            </div>
            <h3 style="margin:0 0 12px;font-family:var(--font-ui);font-size:20px;font-weight:800;line-height:1.3;">{{杂谈标题}}</h3>
            <p style="margin:0;font-size:14.5px;color:var(--fg-muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">{{杂谈摘要。}}</p>
            <div class="tag-row mt-md">
              <span class="tag">#{{标签一}}</span>
            </div>
          </div>
        </a>
      </div>

      <div class="break-inside-avoid">
        <a class="card" href="chatter-detail.html" style="display:block;">
          <div style="position:relative;height:190px;overflow:hidden;">
            <div class="media-card__img" style="position:absolute;"><img src="" alt=""></div>
            <div class="media-card__scrim"></div>
            <span class="badge" style="position:absolute;top:16px;right:16px;">✨ {{心情}}</span>
          </div>
          <div class="card__body">
            <div style="font-family:var(--font-ui);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-bottom:12px;">
              {{YYYY-MM-DD HH:mm:ss}}
            </div>
            <h3 style="margin:0 0 12px;font-family:var(--font-ui);font-size:20px;font-weight:800;line-height:1.3;">{{杂谈标题}}</h3>
            <p style="margin:0;font-size:14.5px;color:var(--fg-muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">{{杂谈摘要。}}</p>
            <div class="tag-row mt-md">
              <span class="tag">#{{标签一}}</span>
              <span class="tag">#{{标签二}}</span>
            </div>
          </div>
        </a>
      </div>

    </section>

    <div class="empty mt-lg" data-slot="chatter-more">
      <div class="empty__icon">⋯</div>
      <span class="empty__title">加载更多</span>
      <span class="empty__hint">{{分页 / 无限滚动的占位说明}}</span>
    </div>

  </main>

  <div data-shell="footer"></div>
</div>

<script src="assets/js/shell.js"></script>
</body>
</html>
