<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="theme-color" content="#eef0f3">
<title>杂谈 · shikibe's blog</title>
<meta name="description" content="杂谈详情页模板。">
<script src="assets/js/theme-init.js"></script>
<link rel="stylesheet" href="assets/css/skeleton.css">
</head>
<body data-route="">
<a class="skip-link" href="#main">跳到主内容</a>
<noscript>
  <div class="noscript-bar">
    <strong>shikibe's blog</strong>本站导航由脚本渲染，当前脚本不可用。可直接访问：
    <a href="index.html">首页</a>
    <a href="timeline.html">归档</a>
    <a href="chatter.html">杂谈</a>
    <a href="photowall.html">照片墙</a>
    <a href="projects.html">项目</a>
    <a href="moments.html">说说</a>
    <a href="music.html">音乐</a>
    <a href="tree.html">灵境</a>
    <a href="friends.html">友链</a>
    <a href="about.html">关于</a>
  </div>
</noscript>
<div class="shell">
  <div data-shell="header"></div>
  <main id="main" class="sheet">
    <header class="article__head" data-slot="chatter-head">
      <div class="article__meta">
        <span>№ {{编号}}</span><span>{{YYYY-MM-DD}}</span><span>杂谈</span>
      </div>
      <h1 class="article__title">{{杂谈标题}}</h1>
      <p class="article__standfirst">{{导语：一句话带过这条记录在讲什么。}}</p>
    </header>

    <div class="split">
      <p class="section-mark">§ 01 · 正文</p>
      <div class="prose" data-slot="chatter-body">
        <p>{{正文段落。}}</p>
        <p>{{正文段落。}}</p>
        <blockquote><p>{{引用块内容。}}</p></blockquote>
        <p>{{正文段落。}}</p>
        <p class="mt-5"><span class="tag"># {{标签}}</span> <span class="tag"># {{标签}}</span></p>
      </div>

      <aside class="margin-col">
        <div class="margin-note" data-slot="author-note">
          <p class="margin-note__title">作者</p>
          <p><strong>{{作者名}}</strong></p>
          <p>{{一句话简介}}</p>
        </div>
        <div class="margin-note" data-slot="recent-note">
          <p class="margin-note__title">近期杂谈</p>
          <div class="facts">
            <div class="facts__row"><a class="facts__k" href="chatter-detail.html">{{杂谈标题}}</a><span class="facts__v num">{{MM-DD}}</span></div>
            <div class="facts__row"><a class="facts__k" href="chatter-detail.html">{{杂谈标题}}</a><span class="facts__v num">{{MM-DD}}</span></div>
          </div>
        </div>
      </aside>
    </div>
  </main>
  <div data-shell="colophon"></div>
</div>
<script src="assets/js/shell.js"></script>
</body>
</html>
