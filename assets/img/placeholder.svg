<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"
     role="img" aria-label="图片占位">
  <!-- 灰阶占位图。用玻璃面板的语言：浅底 + 中灰描边 + 居中的图像字形。
       它要一眼看出「这里缺一张图」，所以字形保持极简、不画具体内容。 -->
  <defs>
    <linearGradient id="ph" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f4f5f8"/>
      <stop offset="1" stop-color="#e2e4ea"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ph)"/>
  <g fill="none" stroke="#9aa0ab" stroke-width="14"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="288" y="228" width="224" height="164" rx="26"/>
    <circle cx="352" cy="284" r="20"/>
    <path d="M300 366l62-56 44 38 34-28 60 50"/>
  </g>
</svg>
